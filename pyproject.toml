[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-backend"
version = "1.0.0"
description = "A reproducible Python RAG backend portfolio project"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "httpx>=0.28,<1",
  "pymupdf>=1.25,<2", "pgvector>=0.3.6,<1", "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.5,<6", "redis>=5.2,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*", "local_inference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
